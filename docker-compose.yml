services:
  carpool:
    image: ghcr.io/eruji/carpools2:latest
    # Uncomment the line below to build locally instead of pulling from ghcr:
    # build: .
    container_name: carpool
    ports:
      - "3000:3000"
    volumes:
      - carpool_data:/data
    environment:
      - SESSION_SECRET=change-this-to-a-random-string
      - ADMIN_PASSWORD=change-me
      - DB_PATH=/data/carpool.db
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    # Unique name — container names are global on the host, and rally-point's
    # compose also used "watchtower", so the two projects fought over it.
    container_name: watchtower-carpool
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 carpool
    restart: unless-stopped

volumes:
  carpool_data:
