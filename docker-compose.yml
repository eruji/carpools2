services:
  carpool:
    image: ghcr.io/eruji/carpools2:latest
    # Uncomment the line below to build locally instead of pulling from ghcr:
    # build: .
    container_name: carpool
    ports:
      - "3000:3000"
    volumes:
      - carpool_data:/data
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      - SESSION_SECRET=change-this-to-a-random-string
      - ADMIN_PASSWORD=change-me
      - DB_PATH=/data/carpool.db
    restart: unless-stopped

volumes:
  carpool_data:
