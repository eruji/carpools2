services:
  carpool:
    image: ghcr.io/YOUR_GITHUB_USER/YOUR_REPO:latest
    # Uncomment the line below to build locally instead of pulling from ghcr:
    # build: .
    container_name: carpool
    ports:
      - "3000:3000"
    volumes:
      - carpool_data:/data
    environment:
      - SESSION_SECRET=change-this-to-a-random-string
      - DB_PATH=/data/carpool.db
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 carpool
    restart: unless-stopped

volumes:
  carpool_data:
